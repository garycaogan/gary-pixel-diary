  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__DURATION__" data-width="1920" data-height="1080">
      <div class="grid"></div>
      <div id="bubbles"></div>
      __HEADER__
      <div id="stage">__SCENES__</div>
      __ROOT_MEDIA__
      <div id="dlg" class="win"><div id="dlg-name"></div><div id="dlg-text"></div><i id="dlg-next"></i></div>
      <div id="portrait" class="win"><div class="dots"></div><div class="floor"></div>__ACTORS__</div>
      <audio id="bgm" src="assets/audio/bgm.wav" data-start="0" data-duration="__DURATION__" data-track-index="8" data-volume="__BGM_VOL__"></audio>
      <audio id="sfx" src="assets/audio/sfx.wav" data-start="0" data-duration="__DURATION__" data-track-index="9" data-volume="1"></audio>
    </div>
    <script>
      const PLAN = __PLAN__;
      const CAST = __CAST__;
      const byId = (id) => document.getElementById(id);
      const WHO = Object.keys(CAST);

      function pixelText(el) {
        const text = el.dataset.text, size = +el.dataset.size, scale = +el.dataset.scale;
        const weight = el.dataset.weight || "900", color = el.dataset.color || "#ffffff";
        const shadow = el.dataset.shadow === "none" ? null : el.dataset.shadow || getComputedStyle(document.documentElement).getPropertyValue("--ring").trim();
        const font = `${weight} ${size}px "PD Sans"`;
        const probe = document.createElement("canvas").getContext("2d");
        probe.font = font;
        const w = Math.ceil(probe.measureText(text).width) + 3, h = Math.ceil(size * 1.3) + 3;
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        const ctx = c.getContext("2d");
        ctx.font = font; ctx.textBaseline = "middle"; ctx.fillStyle = "#000";
        ctx.fillText(text, 1, Math.floor(h / 2));
        const img = ctx.getImageData(0, 0, w, h), d = img.data, on = new Uint8Array(w * h);
        for (let i = 0; i < w * h; i++) on[i] = d[i * 4 + 3] > 110 ? 1 : 0;
        const rgb = (hex) => [1, 3, 5].map((k) => parseInt(hex.slice(k, k + 2), 16));
        const fg = rgb(color), sh = shadow ? rgb(shadow) : null;
        for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
          const i = y * w + x;
          let p = null;
          if (on[i]) p = fg; else if (sh && x > 0 && y > 0 && on[(y - 1) * w + x - 1]) p = sh;
          d[i * 4 + 3] = p ? 255 : 0;
          if (p) { d[i * 4] = p[0]; d[i * 4 + 1] = p[1]; d[i * 4 + 2] = p[2]; }
        }
        ctx.putImageData(img, 0, 0);
        const maxw = +(el.dataset.maxw || 0);
        const k = maxw ? Math.max(1, Math.min(scale, Math.floor(maxw / w))) : scale;  // long text shrinks to fit its box
        c.style.width = w * k + "px"; c.style.height = h * k + "px";
        el.appendChild(c);
      }

      function bubbles(tl) {
        let seed = 7;
        const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
        const box = document.getElementById("bubbles"), T = PLAN.duration;
        for (let i = 0; i < 14; i++) {
          const b = document.createElement("i"), s = [12, 18, 24][i % 3];
          b.className = "bubble"; b.style.width = s + "px"; b.style.height = s + "px";
          b.style.left = Math.round(40 + rnd() * 1840) + "px"; b.style.top = "0px";
          box.appendChild(b);
          const dur = 16 + rnd() * 12, y0 = Math.round(rnd() * 1100), first = (dur * (y0 + 60)) / 1180;
          const reps = Math.max(0, Math.floor((T - first) / dur));
          tl.fromTo(b, { y: y0 }, { y: -60, duration: first, ease: "steps(" + Math.max(1, Math.round(first * 6)) + ")" }, 0);
          tl.fromTo(b, { y: 1120 }, { y: -60, duration: dur, ease: "steps(" + Math.round(dur * 6) + ")", repeat: reps, immediateRender: false }, first);
        }
      }

      const ENTER = { opacity: 1, x: 0, y: 0, duration: 0.24, ease: "steps(4)" };
      const POP = { opacity: 1, scale: 1, duration: 0.18, ease: "steps(3)" };
      function slide(tl, sel, t, from) { tl.fromTo(sel, { opacity: 0, x: 0, y: 0, ...from }, ENTER, t); }
      function pop(tl, sel, t, s) { tl.fromTo(sel, { opacity: 0, scale: s }, POP, t); }
      function hop(tl, who, t) { tl.fromTo(byId("hop-" + who), { y: 0 }, { y: -4 * CAST[who].scale, duration: 0.12, ease: "steps(2)", yoyo: true, repeat: 1, immediateRender: false }, t); }
      function shake(tl, who, t) { tl.fromTo(byId("hop-" + who), { x: 0 }, { x: CAST[who].scale, duration: 0.05, ease: "steps(1)", yoyo: true, repeat: 5, immediateRender: false }, t); }

      // Rebuild a character from blocks of 6×6 sprite pixels, roughly top to bottom.
      function redraw(tl, who, wipe, t0, dur) {
        const a = CAST[who], cell = 6 * a.scale, box = byId("blocks-" + who);
        const cols = Math.ceil(a.w / cell), rows = Math.ceil(a.h / cell);
        let seed = 11;
        const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
        const cells = [];
        for (let r = 0; r < rows; r++) for (let q = 0; q < cols; q++) cells.push({ r, q, k: r + rnd() * 4 });
        cells.sort((x, y) => x.k - y.k);
        cells.forEach((c, i) => {
          const b = document.createElement("i");
          b.style.left = c.q * cell + "px"; b.style.top = c.r * cell + "px";
          b.style.width = cell + "px"; b.style.height = cell + "px";
          b.style.backgroundImage = "url(\"" + a.dir + "/n.png\")";
          b.style.backgroundSize = a.w + "px " + a.h + "px";
          b.style.backgroundPosition = -c.q * cell + "px " + -c.r * cell + "px";
          box.appendChild(b);
          tl.set(b, { opacity: 1 }, t0 + (dur * i) / cells.length);
        });
        tl.set(byId("clip-" + who), { opacity: 0 }, wipe);
        tl.set([byId("grid-" + who), byId("blocks-" + who)], { opacity: 1 }, wipe);
        tl.set(byId("clip-" + who), { opacity: 1 }, t0 + dur + 0.05);
        tl.set(byId("blocks-" + who), { opacity: 0 }, t0 + dur + 0.05);
        tl.to(byId("grid-" + who), { opacity: 0, duration: 0.3 }, t0 + dur + 0.2);
      }

      function scenes(tl) {
        __SCENES_JS__
      }

      const faces = {}, shown = {};
      WHO.forEach((w) => {
        faces[w] = {};
        byId("clip-" + w).querySelectorAll("img").forEach((im) => (faces[w][im.dataset.face] = im));
        shown[w] = null;
      });
      const dlg = document.getElementById("dlg-text"), dlgNext = document.getElementById("dlg-next"), dlgName = document.getElementById("dlg-name");
      const typedEls = [...document.querySelectorAll(".typed-text")], carets = [...document.querySelectorAll(".caret")];
      let speakerShown = null;
      function setFace(w, f) {
        if (!faces[w][f]) f = faces[w][f.replace(/t$/, "")] ? f.replace(/t$/, "") : "n";
        if (shown[w] === f) return;
        if (shown[w]) faces[w][shown[w]].style.opacity = 0;
        faces[w][f].style.opacity = 1;
        shown[w] = f;
      }
      function render(t) {
        let k = -1;
        for (let i = 0; i < PLAN.lines.length; i++) { if (PLAN.lines[i].start <= t) k = i; else break; }
        const L = k >= 0 ? PLAN.lines[k] : null;
        let text = "", done = false;
        WHO.forEach((w, wi) => {
          const blink = ((t + 1.6 + wi * 1.3) * 1000) % 3300 < 130;
          let f = "n";
          if (L && L.who === w) {
            let n = 0;
            while (n < L.times.length && L.times[n] <= t) n++;
            text = L.text.slice(0, n);
            done = n >= L.times.length;
            const base = done ? L.after : L.face;
            f = !done ? (Math.floor((t - L.start) / 0.11) % 2 === 0 ? base + "t" : base) : (base === "n" && blink ? "b" : base);
          } else {
            if (L && L.react && L.react[w]) f = L.react[w];
            else for (let j = k; j >= 0; j--) if (PLAN.lines[j].who === w) { f = PLAN.lines[j].after; break; }
            if (f === "n" && blink) f = "b";
          }
          setFace(w, f);
          if (WHO.length > 1) byId("actor-" + w).style.filter = L && L.who !== w ? "brightness(0.78) saturate(0.6)" : "none";
        });
        const sp = L ? L.who : WHO[0];
        if (sp !== speakerShown) {
          dlgName.textContent = CAST[sp].name;
          dlgName.style.background = CAST[sp].color;
          dlgName.style.color = CAST[sp].on_color;
          speakerShown = sp;
        }
        if (dlg.textContent !== text) dlg.textContent = text;
        dlgNext.style.opacity = done && (t * 1000) % 800 < 480 ? 1 : 0;
        typedEls.forEach((el) => {
          const full = el.dataset.typed, at = +el.dataset.at;
          const m = t < at ? 0 : Math.min(full.length, Math.floor((t - at) / 0.22) + 1);
          if (el.textContent !== full.slice(0, m)) el.textContent = full.slice(0, m);
        });
        const on = (t * 1000) % 900 < 520 ? 1 : 0;
        carets.forEach((c) => (c.style.opacity = on));
      }

      async function build() {
        await Promise.all(["500", "800", "900"].map((w) => document.fonts.load(`${w} 20px "PD Sans"`)));
        document.querySelectorAll(".px").forEach(pixelText);
        const tl = gsap.timeline({ paused: true });
        bubbles(tl);
        scenes(tl);
        __MOVES_JS__
        WHO.forEach((w, i) => {
          const reps = Math.max(0, Math.floor((PLAN.duration - i * 0.35) / 0.7) - 1);
          tl.fromTo(byId("bob-" + w), { y: 0 }, { y: -CAST[w].scale, duration: 0.7, ease: "steps(1)", yoyo: true, repeat: reps }, i * 0.35);
        });
        const clock = { t: 0 };
        tl.fromTo(clock, { t: 0 }, { t: PLAN.duration, duration: PLAN.duration, ease: "none", onUpdate: () => render(clock.t) }, 0);
        render(0);
        window.__timelines["main"] = tl;
        if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
      }
      build();
    </script>
  </body>
</html>
